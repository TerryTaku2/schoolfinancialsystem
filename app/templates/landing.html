<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find your school · School Management</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M6 13l10-5 10 5-10 5z' fill='white'/%3E%3Cpath d='M10 16v5c3 2 9 2 12 0v-5' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="find" novalidate>
      <div class="brand"><div class="logo">SM</div><div><h1>School Management</h1><div class="muted">Sign in to your school</div></div></div>
      {% if error %}<div class="notice warn" style="margin-bottom:14px">{{ error }}</div>{% endif %}
      <div class="form">
        <label class="field"><span>School code</span><input class="input" name="code" autocomplete="organization" required autofocus placeholder="e.g. greenfield-primary"></label>
        <button class="btn primary" type="submit" style="height:40px">Continue</button>
      </div>
      <p class="muted small" style="margin-top:18px">Your school's code is part of the address you were given, e.g. <code>{{ request.host_url }}s/<b>your-school</b>/</code>. Bookmark that address to come straight to your school.</p>
      <p class="small"><a href="{{ request.script_root }}/platform/">Platform console</a></p>
    </form>
  </div>
  <script>
    document.getElementById("find").addEventListener("submit", (e) => {
      e.preventDefault();
      const code = e.target.code.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, "");
      if (code) location.href = "{{ request.script_root }}/s/" + encodeURIComponent(code) + "/";
    });
  </script>
</body>
</html>
