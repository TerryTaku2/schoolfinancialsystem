<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ school_name }} · School Management</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M6 13l10-5 10 5-10 5z' fill='white'/%3E%3Cpath d='M10 16v5c3 2 9 2 12 0v-5' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <meta name="app-root" content="{{ request.script_root }}">
  <!-- Phones: add to home screen and open full-screen like an app. -->
  <link rel="manifest" href="{{ request.script_root }}/manifest.webmanifest">
  <meta name="theme-color" content="#2a78d6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ school_name }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="root" data-school="{{ school_name }}"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript>This application requires JavaScript.</noscript>
  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
