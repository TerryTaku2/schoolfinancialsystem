<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · School Management</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f5f7; color: #1d1f24; }
    @media (prefers-color-scheme: dark) { body { background: #111214; color: #f2f3f5; } .card { background: #1a1b1e; border-color: #2e3036; } }
    .card { max-width: 380px; text-align: center; background: #fff; border: 1px solid #e3e5ea; border-radius: 16px; padding: 32px 24px; }
    img { width: 64px; height: 64px; border-radius: 14px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { margin: 0 0 20px; color: #6b7080; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 22px; background: #2a78d6; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%232a78d6%22/%3E%3Cpath%20d%3D%22M96%20208l160-80%20160%2080-160%2080z%22%20fill%3D%22%23fff%22/%3E%3Cpath%20d%3D%22M160%20256v80c48%2032%20144%2032%20192%200v-80%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2232%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M416%20208v96%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2224%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E" alt="">
    <h1>You're offline</h1>
    <p>The school system needs an internet connection to load your data. Check your Wi-Fi or mobile data and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
